<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"
     width="1024" height="1024" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Karighar</title>
  <desc id="desc">Maskable PWA variant. A brushed-steel house roof and chimney over the letter K, with a lit brass
    window, raised on a deep green velvet tile.</desc>
  <defs>
    <!-- ================= velvet ================= -->
    <linearGradient id="tileBase" x1="0.1" y1="0" x2="0.85" y2="1">
      <stop offset="0"    stop-color="#103420"/>
      <stop offset="0.42" stop-color="#0d2a1b"/>
      <stop offset="1"    stop-color="#112f1f"/>
    </linearGradient>
    <radialGradient id="tileSheen" cx="0.36" cy="0.26" r="0.78">
      <stop offset="0"    stop-color="#569270" stop-opacity="0.13"/>
      <stop offset="0.55" stop-color="#2b6246" stop-opacity="0.08"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.30"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.38" cy="0.32" r="0.92">
      <stop offset="0.3"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#000000" stop-opacity="0.07"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.18"/>
    </radialGradient>
    <!-- Pile. Two layers, because velvet is two things at once: broad
         crushed clumping where the nap lies in different directions, and a
         fine tufted grain on top. feTurbulence octaves only ever run FINER
         than the base frequency, so a single high-frequency layer gives
         salt-and-pepper and no clumping at all - the coarse layer has to be
         its own pass. Band energies were matched against the render across
         six spatial scales. -->
    <filter id="pile" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2"
                    seed="17" result="clump"/>
      <feTurbulence type="fractalNoise" baseFrequency="1.3" numOctaves="1"
                    seed="29" result="tuft"/>
      <feComposite in="clump" in2="tuft" operator="arithmetic"
                   k1="0" k2="0.26" k3="0.74" k4="0" result="mix"/>
      <feColorMatrix in="mix" type="matrix"
        values="1.85 0 0 0 -0.487   1.85 0 0 0 -0.487   1.85 0 0 0 -0.487   0 0 0 0 1"
        result="tone"/>
      <feGaussianBlur in="tone" stdDeviation="0.45"/>
    </filter>

    <!-- ================= steel ================= -->
    <!-- Metal is banded, not a single ramp: light, shadow, light again. -->
    <linearGradient id="steel" x1="0.06" y1="0" x2="0.78" y2="1">
      <stop offset="0"    stop-color="#fbfcfa"/>
      <stop offset="0.14" stop-color="#cfd4cd"/>
      <stop offset="0.34" stop-color="#8d948c"/>
      <stop offset="0.52" stop-color="#5c645d"/>
      <stop offset="0.72" stop-color="#b6bcb4"/>
      <stop offset="0.87" stop-color="#7b837b"/>
      <stop offset="1"    stop-color="#474f49"/>
    </linearGradient>
    <filter id="grainAlong" filterUnits="userSpaceOnUse"
            x="-420" y="-420" width="1864" height="1864">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 1.25" numOctaves="3"
                    seed="5" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.5  0 0 0 0 0.51  0 0 0 0 0.5  0 0 0 0.9 0"/>
    </filter>
    <filter id="grainAcross" filterUnits="userSpaceOnUse"
            x="-420" y="-420" width="1864" height="1864">
      <feTurbulence type="fractalNoise" baseFrequency="1.25 0.004" numOctaves="3"
                    seed="9" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.5  0 0 0 0 0.51  0 0 0 0 0.5  0 0 0 0.9 0"/>
    </filter>
    <filter id="bevelSteel" x="-14%" y="-14%" width="128%" height="128%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5.0" result="bump"/>
      <feDiffuseLighting in="bump" surfaceScale="12" diffuseConstant="1.5"
                         lighting-color="0.85" result="dif">
        <feDistantLight azimuth="228" elevation="46"/>
      </feDiffuseLighting>
      <feComposite in="dif" in2="SourceAlpha" operator="in" result="difC"/>
      <feBlend in="SourceGraphic" in2="difC" mode="multiply" result="body"/>
      <feSpecularLighting in="bump" surfaceScale="12" specularConstant="1.05"
                          specularExponent="48" lighting-color="#ffffff" result="spc">
        <feDistantLight azimuth="228" elevation="61"/>
      </feSpecularLighting>
      <feComposite in="spc" in2="SourceAlpha" operator="in" result="spcC"/>
      <feComposite in="body" in2="spcC" operator="arithmetic" k1="0" k2="1" k3="0.8" k4="0"/>
    </filter>

    <!-- ================= brass ================= -->
    <linearGradient id="brass" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0"    stop-color="#ffeab0"/>
      <stop offset="0.32" stop-color="#d9b062"/>
      <stop offset="0.7"  stop-color="#9c7834"/>
      <stop offset="1"    stop-color="#64491d"/>
    </linearGradient>
    <filter id="bevelBrass" x="-14%" y="-14%" width="128%" height="128%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.6" result="bump"/>
      <feDiffuseLighting in="bump" surfaceScale="6" diffuseConstant="1.46"
                         lighting-color="0.9" result="dif">
        <feDistantLight azimuth="228" elevation="46"/>
      </feDiffuseLighting>
      <feComposite in="dif" in2="SourceAlpha" operator="in" result="difC"/>
      <feBlend in="SourceGraphic" in2="difC" mode="multiply" result="body"/>
      <feSpecularLighting in="bump" surfaceScale="6" specularConstant="1.35"
                          specularExponent="24" lighting-color="#fffaf0" result="spc">
        <feDistantLight azimuth="228" elevation="61"/>
      </feSpecularLighting>
      <feComposite in="spc" in2="SourceAlpha" operator="in" result="spcC"/>
      <feComposite in="body" in2="spcC" operator="arithmetic" k1="0" k2="1" k3="0.8" k4="0"/>
    </filter>

    <!-- the metal stands proud: a wide soft cast plus a tight contact line -->
    <filter id="cast" x="-22%" y="-22%" width="155%" height="155%">
      <feDropShadow dx="8" dy="13" stdDeviation="12" flood-color="#03120a" flood-opacity="0.58"/>
      <feDropShadow dx="2" dy="3"  stdDeviation="1.8" flood-color="#010c06" flood-opacity="0.75"/>
    </filter>

    <clipPath id="tileClip"><rect width="1024" height="1024"/></clipPath>
    <clipPath id="roofClip"><path d="M763.43 162.54L762.51 158.71L759.79 154.63L756.61 152.32L751.88 150.99L696.47 150.99L691.74 152.32L688.56 154.63L685.84 158.71L684.92 162.54L684.88 237.37L533.29 133.72L523.02 129.38L514.77 127.99L506.4 128.27L495.64 131.21L488.3 135.22L153.9 364.24L147.97 369.92L144.68 374.31L140.88 381.6L139.18 386.81L138.17 392.2L137.99 400.42L138.77 405.84L141.24 413.68L145.2 420.88L150.48 427.18L156.89 432.32L164.18 436.11L172.07 438.41L180.26 439.12L188.43 438.22L198.75 434.59L511.97 220.61L822.8 433.27L832.86 437.57L840.95 439L849.16 438.82L859.76 436.11L869.3 430.74L875.36 425.19L880.22 418.57L883.7 411.12L885.95 400.42L885.78 392.2L884 384.18L879.27 374.31L874.13 367.9L867.84 362.62L763.47 291.17Z"/></clipPath>
    <clipPath id="kClip"><path d="M282.48 425.5L284.37 414.05L289.85 403.81L298.32 395.87L304.48 392.58L311.16 390.55L318.11 389.87L354.79 389.87L361.74 390.55L368.42 392.58L374.58 395.87L383.05 403.81L387.7 411.86L390.34 423.17L390.48 580.89L392.06 586.24L395.52 590.61L400.36 593.38L405.88 594.14L411.29 592.79L414.8 590.49L636.77 394.89L643.58 391.58L650.97 390L700.51 389.87L709.37 391.63L716.87 396.65L720.55 401.44L722.86 407.02L723.6 411.49L723.65 424.12L721.76 434.84L716.33 444.28L546.59 598.22L543.17 603.07L542.12 608.91L542.97 613.08L545.06 616.79L750.43 875.62L752.61 879.75L753.12 884.39L751.91 888.9L749.13 892.66L745.17 895.14L740.58 896.01L655.22 895.99L646.38 894.38L638.34 890.34L632.51 885.06L467.55 693.07L461.33 688.54L454.85 687.23L448.36 688.53L443.69 691.47L394.96 734.8L391.31 740.36L390.42 745.41L390.34 861.66L387.7 872.97L381.58 882.82L376.48 887.6L368.42 892.25L361.74 894.28L354.79 894.96L318.11 894.96L311.16 894.28L300.3 890.19L292.92 884.52L288.49 879.13L285.19 872.97L283.17 866.28L282.48 859.33Z"/></clipPath>
    <clipPath id="halfL"><rect x="-420" y="-420" width="932" height="1864"/></clipPath>
    <clipPath id="halfR"><rect x="512" y="-420" width="932" height="1864"/></clipPath>
    <linearGradient id="rim" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0"    stop-color="#7cb795" stop-opacity="0.8"/>
      <stop offset="0.42" stop-color="#2d6a4c" stop-opacity="0.14"/>
      <stop offset="1"    stop-color="#01100a" stop-opacity="0.66"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#tileClip)">
    <rect width="1024" height="1024" fill="url(#tileBase)"/>
    <rect width="1024" height="1024" fill="url(#tileSheen)"/>
    <rect width="1024" height="1024" filter="url(#pile)" opacity="0.62"
          style="mix-blend-mode:overlay"/>
    <rect width="1024" height="1024" fill="url(#vignette)"/>

    <g transform="translate(512 512) scale(0.88) translate(-512 -512)">
    <g filter="url(#cast)">
      <path d="M763.43 162.54L762.51 158.71L759.79 154.63L756.61 152.32L751.88 150.99L696.47 150.99L691.74 152.32L688.56 154.63L685.84 158.71L684.92 162.54L684.88 237.37L533.29 133.72L523.02 129.38L514.77 127.99L506.4 128.27L495.64 131.21L488.3 135.22L153.9 364.24L147.97 369.92L144.68 374.31L140.88 381.6L139.18 386.81L138.17 392.2L137.99 400.42L138.77 405.84L141.24 413.68L145.2 420.88L150.48 427.18L156.89 432.32L164.18 436.11L172.07 438.41L180.26 439.12L188.43 438.22L198.75 434.59L511.97 220.61L822.8 433.27L832.86 437.57L840.95 439L849.16 438.82L859.76 436.11L869.3 430.74L875.36 425.19L880.22 418.57L883.7 411.12L885.95 400.42L885.78 392.2L884 384.18L879.27 374.31L874.13 367.9L867.84 362.62L763.47 291.17Z" fill="url(#steel)" filter="url(#bevelSteel)"/>
      <path d="M282.48 425.5L284.37 414.05L289.85 403.81L298.32 395.87L304.48 392.58L311.16 390.55L318.11 389.87L354.79 389.87L361.74 390.55L368.42 392.58L374.58 395.87L383.05 403.81L387.7 411.86L390.34 423.17L390.48 580.89L392.06 586.24L395.52 590.61L400.36 593.38L405.88 594.14L411.29 592.79L414.8 590.49L636.77 394.89L643.58 391.58L650.97 390L700.51 389.87L709.37 391.63L716.87 396.65L720.55 401.44L722.86 407.02L723.6 411.49L723.65 424.12L721.76 434.84L716.33 444.28L546.59 598.22L543.17 603.07L542.12 608.91L542.97 613.08L545.06 616.79L750.43 875.62L752.61 879.75L753.12 884.39L751.91 888.9L749.13 892.66L745.17 895.14L740.58 896.01L655.22 895.99L646.38 894.38L638.34 890.34L632.51 885.06L467.55 693.07L461.33 688.54L454.85 687.23L448.36 688.53L443.69 691.47L394.96 734.8L391.31 740.36L390.42 745.41L390.34 861.66L387.7 872.97L381.58 882.82L376.48 887.6L368.42 892.25L361.74 894.28L354.79 894.96L318.11 894.96L311.16 894.28L300.3 890.19L292.92 884.52L288.49 879.13L285.19 872.97L283.17 866.28L282.48 859.33Z"    fill="url(#steel)" filter="url(#bevelSteel)"/>
      <rect x="463.77" y="297.65" width="39.82" height="39.82" rx="5.24" fill="url(#brass)" filter="url(#bevelBrass)"/><rect x="517.21" y="297.65" width="39.82" height="39.82" rx="5.24" fill="url(#brass)" filter="url(#bevelBrass)"/><rect x="463.77" y="351.1" width="39.82" height="39.82" rx="5.24" fill="url(#brass)" filter="url(#bevelBrass)"/><rect x="517.21" y="351.1" width="39.82" height="39.82" rx="5.24" fill="url(#brass)" filter="url(#bevelBrass)"/>
    </g>

    <!-- Brushing follows the form, the way a real linisher leaves it: along
         each roof arm, and down the K. A single global direction is the tell
         that a metal texture was pasted on rather than worked. -->
    </g>
    <g transform="translate(512 512) scale(0.88) translate(-512 -512)" style="mix-blend-mode:overlay" opacity="0.5">
      <g clip-path="url(#roofClip)">
        <g clip-path="url(#halfL)">
          <g transform="rotate(-34.4 512 512)"><rect x="-420" y="-420" width="1864" height="1864" filter="url(#grainAlong)"/></g>
        </g>
        <g clip-path="url(#halfR)">
          <g transform="rotate(34.4 512 512)"><rect x="-420" y="-420" width="1864" height="1864" filter="url(#grainAlong)"/></g>
        </g>
      </g>
      <g clip-path="url(#kClip)"><rect x="-420" y="-420" width="1864" height="1864" filter="url(#grainAcross)"/></g>
    </g>
  </g>
</svg>
